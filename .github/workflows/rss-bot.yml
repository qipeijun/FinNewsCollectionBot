name: 📡 RSS 财经新闻自动推送

on:
  # 定时触发：每天上午9点和下午5点（北京时间）
  schedule:
    - cron: '0 1 * * *'  # 北京时间 09:00 (UTC 01:00)
    - cron: '0 9 * * *'  # 北京时间 17:00 (UTC 09:00)
  
  # 手动触发
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式（不发送微信推送）'
        required: false
        default: false
        type: boolean

jobs:
  collect-and-summarize:
    name: 收集与推送财经摘要
    runs-on: ubuntu-latest
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    
    steps:
    - name: 📥 检出代码（checkout）
      uses: actions/checkout@v4
      
    - name: 🐍 设置 Python 环境（setup-python）
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 📦 安装依赖（pip install）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🔧 设置环境变量（导入Secrets到环境）
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        echo "SERVER_CHAN_KEYS=${{ secrets.SERVER_CHAN_KEYS }}" >> $GITHUB_ENV
        echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> $GITHUB_ENV
        echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
        echo "EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}" >> $GITHUB_ENV
        echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> $GITHUB_ENV
        echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> $GITHUB_ENV
        echo "EMAIL_TO=${{ secrets.EMAIL_TO }}" >> $GITHUB_ENV
        
    - name: 🚀 运行财经新闻收集和摘要（python financebot.py）
      run: |
        python financebot.py
    
    - name: ✉️ 发送邮件报告（send_email_report.py）
      if: ${{ env.EMAIL_USERNAME != '' && env.EMAIL_PASSWORD != '' && env.EMAIL_TO != '' }}
      run: |
        python scripts/send_email_report.py \
          --subject "📌 $(date +"%Y-%m-%d") 财经新闻摘要" \
          --html-file output/latest_report.html \
          --text-file output/latest_report.txt
        
    - name: 📊 显示运行结果（日志尾声）
      if: always()
      run: |
        echo "✅ 财经新闻收集任务完成"
        echo "📅 运行时间: $(date)"